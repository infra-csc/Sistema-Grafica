# ─────────────────────────────────────────────────────────────────────────────
# CI — o que precisa estar verde antes de qualquer merge.
#
# SEM SEGREDOS, de propósito. Nada aqui toca banco, bucket ou e-mail: são o
# compilador e a suíte de testes, que rodam com o banco de mentira. Um CI que
# precisa de credencial é um CI que ninguém consegue rodar num fork — e é um
# lugar a mais de onde uma senha pode vazar.
#
# Três jobs: tipos/testes/build (sempre), migrações contra um Postgres em
# memória (sempre) e ponta a ponta com o app inteiro local (só à mão). Os dois
# últimos usam PGlite — Postgres em WebAssembly, sem serviço e sem segredo.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Botão "Run workflow" na aba Actions — é o que liga o job de ponta a ponta.
  workflow_dispatch:

# Push seguido de push na mesma branch: a execução velha é cancelada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # O mesmo Node do Replit (.replit: nodejs-20).
          node-version: "20"
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock.json. Instalação que "resolve" versões sozinha faz o CI
      # testar um conjunto de dependências que ninguém tem na máquina.
      - name: Instalar dependências
        run: npm ci

      - name: Tipos do app
        run: npm run check

      # Os testes ficam fora do tsconfig do app (ele exclui **/*.test.ts).
      # Este passo é o que impede que eles voltem a envelhecer sem aviso.
      - name: Tipos dos testes
        run: npm run check:tests

      # A suíte inteira: o projeto "servidor" e, depois dele, o "telas".
      # O "telas" monta React no jsdom e é pesado — o vitest.config.ts o limita
      # a 4 workers (WORKERS_DE_TELA) e o põe em segundo na ordem, justamente
      # para ele não disputar CPU com os ~230 testes de servidor e estourar o
      # tempo. Num runner de 2 vCPUs esse teto vale ainda mais.
      - name: Testes
        run: npm test
        env:
          # Nenhum teste abre conexão, mas server/db.ts LANÇA no import sem
          # esta variável. URL de mentira, banco que não existe.
          DATABASE_URL: postgres://ci:ci@localhost:5432/banco_nunca_acessado
          SESSION_SECRET: ci-sem-segredo-nenhum-so-para-o-import-passar

      - name: Build
        run: npm run build

      # Quando um teste de tela cai, o relatório em texto raramente basta.
      - name: Guardar o relatório do build que falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saida-do-ci
          path: |
            dist/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # MIGRAÇÕES: as de migrations/ reproduzem shared/schema.ts?
  # Sobe um Postgres VAZIO em memória (PGlite — WebAssembly, sem serviço, sem
  # segredo), aplica todas as migrações do zero e compara com o schema
  # (scripts/ci-migracoes.mjs). Falha quando alguém mudou o schema e não gerou
  # a migração (`npm run db:generate`), quando uma migração não roda num banco
  # vazio, ou quando a migração aditiva antiga ainda cria algo que as
  # migrações não criam. Também exercita o modo de adoção do migrar.mjs.
  # ───────────────────────────────────────────────────────────────────────────
  migracoes:
    name: migrações reproduzem o schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O PGlite mora FORA do projeto (instalado dentro, duplicaria o
      # drizzle-orm e quebraria os tipos) — ver scripts/local/ferramentas.mjs.
      NORTE_FERRAMENTAS: ${{ runner.temp }}/ferramentas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: PGlite (fora do projeto)
        run: npm run ferramentas:instalar -- --sem-navegador
      - name: Migrações do zero + drift contra o schema
        run: npm run db:migrate:ci
      # Os testes de INTEGRAÇÃO (server/__tests__/integracao-*.test.ts): rotas
      # reais contra este mesmo PGlite, migrações do zero. No job de testes
      # acima eles PULAM (lá não há PGlite) — é aqui que rodam de verdade.
      - name: Testes de integração (rotas reais + PGlite)
        run: npx vitest run --project servidor integracao-

  # ───────────────────────────────────────────────────────────────────────────
  # PONTA A PONTA (e2e/) — só quando disparado à mão (aba Actions → CI → Run
  # workflow): sobe o app inteiro com banco em memória (npm run e2e) e percorre
  # os cinco fluxos nas três larguras. Leva ~20 min; por isso não roda a cada
  # push.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: ponta a ponta (app local)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NORTE_FERRAMENTAS: ${{ runner.temp }}/ferramentas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: PGlite, Playwright e Chromium (fora do projeto)
        run: npm run ferramentas:instalar -- --com-deps
      - name: Os cinco fluxos, nas três larguras
        run: npm run e2e
      - name: Guardar traces, vídeos e screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falhas
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
