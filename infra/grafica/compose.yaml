name: ${COMPOSE_PROJECT_NAME:-grafica-homolog}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grafica_homolog}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD no arquivo .env}
      GRAFICA_DB_USER: ${GRAFICA_DB_USER:-grafica_app}
      GRAFICA_DB_PASSWORD: ${GRAFICA_DB_PASSWORD:?Defina GRAFICA_DB_PASSWORD no arquivo .env}
      # O app grava e lê horários assumindo UTC (como no Neon).
      TZ: UTC
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    # pgAdmin usa túnel SSH; nunca publicar em 0.0.0.0 ou IPv6 público.
    ports:
      - '127.0.0.1:5432:5432'
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

# PostgreSQL acessível apenas em loopback no host e na rede backend do Docker.
