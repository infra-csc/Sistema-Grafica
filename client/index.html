<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Sem maximum-scale: bloquear o zoom impedia ampliar thumbs e tabelas no
         celular, que é justamente o que se faz numa tela de conferência. -->
    <!-- interactive-widget=resizes-content: com o teclado aberto o layout encolhe
         para a area visivel (Chrome Android), e o Confirmar dos modais nao fica
         escondido atras do teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Miró — Sistema de Gestão de Produção Gráfica</title>
    <!-- Marca Miró Comunicação Visual (30/10): o símbolo; na aba escura o grafite vira claro (o SVG tem a media query). -->
    <link rel="icon" type="image/svg+xml" href="/brand/miro-favicon-20261030.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Miró Comunicação Visual — gestão da produção gráfica: eventos, peças, fluxo de aprovação e acompanhamento em tempo real." />
    <!-- O galpão usa CELULAR. Com o manifest e display: standalone, "adicionar
         à tela de início" instala um atalho que abre sem a barra do navegador
         — mais 60px de tela útil numa conferência feita com o aparelho na mão,
         e o app deixa de parecer um site aberto por engano. O theme-color
         pinta a barra de status com o mesmo #fafaf9 do fundo da página, para
         a emenda entre o sistema e o app sumir. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Miró" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- TRÊS FAMÍLIAS, TRÊS PAPÉIS — eram seis.
         Inter carrega o corpo, Space Grotesk os títulos e números, DM Mono o
         que só se compara alinhado em coluna (medida, id, código).

         Saíram Manrope (2 usos no app inteiro), Outfit (2) e Plus Jakarta Sans
         (63). As duas primeiras não faziam papel nenhum que já não fosse de
         outra. A terceira fazia o MESMO papel de Space Grotesk — título — só
         que em telas diferentes, o que deixava dois cabeçalhos do mesmo
         produto com desenho de letra diferente conforme a rota.

         Os arquivos que ainda pedem "Plus Jakarta Sans" no `fontFamily` caem
         no fallback (Inter) sem quebrar; a troca por FONT.display fica para a
         rodada das telas grandes — está listada no relatório. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
